name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1
          python -m pip install --upgrade pip pyinstaller pywebview
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build single-file binary
        run: pyinstaller --noconfirm packaging/xerj-companion.spec
      - name: Build .deb
        run: python packaging/build_deb.py --out dist
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/*.deb out/
          cp "dist/XERJ-Companion-NO-OFICIAL" out/
          tar -czf "out/xerj-companion-${{ github.ref_name }}.tar.gz" -C dist XERJ-Companion-NO-OFICIAL
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build .exe
        run: pyinstaller --noconfirm packaging/xerj-companion.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/XERJ-Companion-NO-OFICIAL.exe
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
